{{- if .Values.ingress.enabled }}
{{- $fullname := include "grommunio.fullname" . }}
{{- $host := .Values.ingress.host | default .Values.config.fqdn }}
{{- $tls := .Values.ingress.tls }}
{{- if .Values.ingress.admin }}
  {{- range .Values.ingress.admin.tls }}
    {{- $tls = append $tls . }}
  {{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "grommunio.labels" (dict "root" . "component" "core") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    {{- toYaml $tls | nindent 4 }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-core
                port:
                  name: https
{{- if .Values.ingress.admin }}
    - host: {{ .Values.ingress.admin.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-core
                port:
                  name: https-admin
{{- end }}
{{- end }}
